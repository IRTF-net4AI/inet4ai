description: >
  The generative AI landscape is traversing several important changes.
  <br/><br/>
  First, the training of generative AI foundation models is approaching 
  a scalability limit. The ever-growing size of large language models 
  makes it infeasible to train such models in a single datacenter due 
  to power density issues. In the past few months, AI infrastructure 
  providers have developed scale-across interconnection systems to 
  distribute generative AI workloads beyond the realm of a single 
  datacenter on top of a private WAN infrastructure, while some 
  research projects have developed fault and latency-tolerant 
  collective communication methods to train large models across the 
  Internet. 
  <br/><br/>
  Part of the distributed AI systems community has shifted towards 
  addressing fine-tuning and inferencing issues. Indeed, as the adoption
  of services based on generative AI is ramping up, some modes of 
  operation ask for stringent quality of service levels in order to meet 
  users demand. Besides, the strong development of agentic AI is 
  resulting in the development of distributed inference nodes, serving 
  requests generated by agentic workloads and communicating in an 
  uncoordinated manner in opportunistic multi-agent systems. Meeting the 
  latency requirements of AI-based applications can be addressed by 
  using systems mixing powerful computing instances residing in cloud 
  platforms with localized edge platforms, using heterogeneous and 
  distributed systems.
  <br/><br/>
  At the same time, questions arise related to the governance and 
  operational models of generative AI services, in particular due to 
  data ownership and trustworthiness aspects. While some of those 
  concerns can find a solution in federated learning systems, in which 
  data ownership can be retained, and models are trained among several 
  stakeholders, the increasing use of (agentic) AI systems in the 
  operation of critical services requires a proper tracing 
  authentication and authorization system to frame generative AI's scope 
  of work and enforce AI agents' accountability and traceability. 
  <br/><br/>
  The fundamental question underlying those changes is how generative AI 
  systems impact the internet, and how the Internet can help in 
  operating distributed generative and/or agentic AI systems at a large 
  scale. This workshop, initiated in the realm of the Internet Research 
  Task Force (IRTF), aims at discussing different aspects of this 
  question. To that extend, we aim at receiving contributions from 
  academic researchers, machine learning system developers or AI 
  infrastructure providers on the following topics:
submission: ./submission.html
areas:
- topics:
  - Future communication challenges related to the evolution of AI systems (reasoning models, Mixture of Experts...);
  - Traffic characterization for distributed AI training or inference workloads;
  - Collective communications for the Internet;
  - Network protocols adaptations to scale out AI workloads;
  - Domain-Specific transport protocols;
  - Lossy and/or lossless transport protocols for distributed training and inference;
  - Dynamic compression, quantization, and model sparsification;
  - Congestion control methods for GPU-centric communications;
  - Parallelism for heterogeneous and/or distributed AI systems;
  - In-Network processing used in large scale and/or federated distributed AI systems; 
  - Large scale disaggregation of AI training or inference systems;
  - Load balancing and routing for heterogeneous and/or distributed AI systems;
  - KV-cache distribution, towards KV-centric networking;
  - Federated learning;
  - Security and privacy of distributed AI communications; 
  - Encryption methods for distributed AI communications;
  - Distributing AI workloads among heterogeneous nodes;
  - Decentralized system designs for AI services;
  - Edge-core distribution of AI workloads;
  - Thin-waist architectures for agent networking;
  - Minimal interoperability substrates for agent ecosystems;
  - Agent naming, identity, addressing, and persistence;
  - Capability-based discovery and routing;
  - Intent-driven, goal-oriented, and receiver-driven communication;
  - Transport protocols for agent-to-agent and agent-to-service interaction;
  - Multi-party, streaming, pub/sub, and asynchronous agent communication;
  - Naming and discovery across heterogeneous agent platforms;
  - Network support for dynamic agent instantiation and migration;
  - Edge, cloud, and local-inference architectures for agent ecosystems;
  - Measurement, benchmarking, and performance evaluation of agent systems;
  - Scalability, robustness, and failure handling in large-scale agent ecosystems;
  - Real-world deployments, case studies, privacy, governance, and regulation.

